plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.snake.android'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.snake.android'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java.srcDirs += ['../src/main/java']
            java.exclude '**/GameBoard.java', '**/SnakeGameApp.java'
        }
    }
}
